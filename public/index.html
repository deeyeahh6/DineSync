<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DineSync – One Table. One Shared Experience.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E8;--pri:#687653;--pri-d:#55623f;--sage:#A7B092;--ink:#292B25;--mut:#5b5f53;--sh:#d9d2c0;--hi:#fffdf7;--warn:#8a5a12;--bad:#9b3b2f;
--out:7px 7px 16px var(--sh),-7px -7px 16px var(--hi);--out-s:4px 4px 10px var(--sh),-4px -4px 10px var(--hi);--in:inset 4px 4px 9px var(--sh),inset -4px -4px 9px var(--hi);--r:22px;
--serif:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);min-height:100vh;padding-bottom:96px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:var(--bg);min-height:48px;transition:box-shadow .2s,transform .2s,background .2s}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font:700 1.45rem var(--serif);letter-spacing:-.01em}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--bg);box-shadow:var(--out-s);color:var(--pri);font:700 1.3rem var(--serif)}
.pill{padding:10px 18px;border-radius:999px;box-shadow:var(--in);font-weight:700;color:var(--pri-d);white-space:nowrap}
h1,h2,h3{font-family:var(--serif);line-height:1.15}
.hero{padding:18px 0 8px}.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);max-width:16em}.hero p{color:var(--mut);margin-top:6px}
.search{margin:18px 0 14px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:999px;box-shadow:var(--in)}
.search input{flex:1;min-height:52px;border:0;background:none;font:inherit;color:var(--ink);outline:0}
.cats{display:flex;gap:12px;overflow-x:auto;padding:8px 6px 18px;scrollbar-width:none}
.cat{padding:0 22px;border-radius:999px;box-shadow:var(--out-s);white-space:nowrap;font-weight:500}
.cat:hover{transform:translateY(-1px)}.cat[aria-pressed=true]{box-shadow:var(--in);color:var(--pri-d);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;padding:8px 6px}
.card{background:var(--bg);border-radius:var(--r);box-shadow:var(--out);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s}
.card:hover{transform:translateY(-3px)}
.card .ph{aspect-ratio:4/3;background:var(--sage) center/cover no-repeat;margin:10px;border-radius:calc(var(--r) - 8px);display:grid;place-items:center;font:700 2.6rem var(--serif);color:#fff}
.card .b{padding:4px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.15rem}.card p{color:var(--mut);font-size:.92rem;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-weight:700}
.rate{color:var(--warn);font-weight:700}
.add,.btn{border-radius:16px;box-shadow:var(--out-s);font-weight:700;padding:0 20px}
.add{background:var(--pri);color:#fff;width:100%}.add:hover,.btn.pri:hover{background:var(--pri-d)}
.add:active,.btn:active,.cat:active{box-shadow:var(--in)}
.btn.pri{background:var(--pri);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.stepper{display:flex;align-items:center;justify-content:space-between;border-radius:16px;box-shadow:var(--in);padding:4px}
.stepper button{width:46px;min-height:46px;border-radius:13px;box-shadow:var(--out-s);font-size:1.4rem;font-weight:700;color:var(--pri-d)}
.stepper b{font-size:1.1rem;min-width:2ch;text-align:center}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 24px;min-height:60px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700;box-shadow:var(--out)}
.fab .n{background:#fff;color:var(--pri-d);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:.9rem;padding:0 8px}
.fab.bump{animation:bump .35s}@keyframes bump{50%{transform:scale(1.08)}}
.scrim{position:fixed;inset:0;background:rgba(41,43,37,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--bg);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1);
left:0;right:0;bottom:0;max-height:88vh;border-radius:28px 28px 0 0;transform:translateY(105%);box-shadow:0 -10px 40px rgba(41,43,37,.2)}
.sheet.on{transform:none}
@media(min-width:820px){.sheet{left:auto;top:0;width:440px;max-height:none;border-radius:28px 0 0 28px;transform:translateX(105%)}}
.sheet .hd{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:10px;padding:0 20px 12px}.tabs button{flex:1;border-radius:14px;box-shadow:var(--out-s);font-weight:700}.tabs button[aria-selected=true]{box-shadow:var(--in);color:var(--pri-d)}
.sheet .bd{overflow:auto;padding:6px 20px 20px;flex:1}
.sheet .ft{padding:14px 20px 20px;box-shadow:0 -6px 14px -8px var(--sh)}
.group{border-radius:18px;box-shadow:var(--out-s);padding:14px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #e3dccb;font-size:.9rem}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.8rem;font-weight:700;box-shadow:var(--in)}
.chip.Pending{color:var(--warn)}.chip.Confirmed{color:var(--pri-d)}.chip.Preparing{color:#2f5d7a}.chip.Completed{color:#3d6b3a}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}.lock{color:var(--mut);font-size:.85rem}
.total{display:flex;justify-content:space-between;font:700 1.3rem var(--serif);margin-bottom:12px}
.empty,.state{text-align:center;padding:36px 16px;color:var(--mut)}.empty b,.state b{display:block;font:700 1.2rem var(--serif);color:var(--ink);margin-bottom:4px}
.assist{display:grid;gap:16px}
.assist button{display:flex;align-items:center;gap:16px;text-align:left;padding:18px;border-radius:20px;box-shadow:var(--out);min-height:84px}
.assist button:hover{transform:translateY(-2px)}.assist button[disabled]{box-shadow:var(--in);cursor:default}
.assist .ic{width:48px;height:48px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;color:var(--pri-d);flex:none}
.assist strong{display:block}.assist small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;z-index:80;opacity:0;transition:.3s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad)}
.sk{height:330px;border-radius:var(--r);box-shadow:var(--out);background:linear-gradient(100deg,transparent 30%,rgba(255,253,247,.7) 50%,transparent 70%) var(--bg);background-size:300% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-100% 0}}
.modal{position:fixed;inset:0;z-index:90;background:rgba(245,241,232,.94);display:grid;place-items:center;padding:24px;text-align:center}
.modal .box{max-width:380px;padding:34px;border-radius:28px;box-shadow:var(--out)}.modal h2{margin-bottom:8px}.modal p{color:var(--mut);margin-bottom:20px}
.views{position:fixed;left:18px;bottom:18px;z-index:25;display:flex;gap:8px}
.views a{padding:10px 14px;border-radius:12px;box-shadow:var(--out-s);color:var(--mut);font-size:.85rem;text-decoration:none;background:var(--bg)}.views a[aria-current=true]{color:var(--pri-d);font-weight:700;box-shadow:var(--in)}
.tickets,.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;padding:10px 6px}
.ticket,.tcard{padding:18px;border-radius:var(--r);box-shadow:var(--out);display:flex;flex-direction:column;gap:10px}
.ticket h3{font-size:1.2rem}.big{font:700 2rem var(--serif);color:var(--pri-d)}
.elig{padding:8px 12px;border-radius:12px;box-shadow:var(--in);font-size:.88rem;font-weight:700}.elig.yes{color:var(--warn)}.elig.no{color:var(--mut)}
.cols{display:grid;gap:30px;grid-template-columns:1fr}@media(min-width:980px){.cols{grid-template-columns:2fr 1fr}}
.req{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;box-shadow:var(--out-s);margin-bottom:16px}.req.urgent{border-left:6px solid var(--bad)}
h2.sec{font-size:1.4rem;margin:18px 6px 6px}
.qr{width:84px;height:84px;border-radius:12px;box-shadow:var(--in);padding:6px;background:#fff}
.free{color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{display:flex;gap:12px;margin:18px 0 4px;padding:6px;border-radius:999px;box-shadow:var(--in)}
.seg button{flex:1;border-radius:999px;font-weight:700;min-height:50px;color:var(--mut)}.seg button[aria-selected=true]{box-shadow:var(--out-s);color:var(--pri-d)}
.note{color:var(--mut);margin:14px 6px 4px}
.card.ess .ic{width:72px;height:72px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;color:var(--pri-d);margin:22px auto 6px}
.card.ess .b{text-align:center}.card.ess .b p{margin-bottom:8px}
.sos{position:fixed;left:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:12px;background:none;box-shadow:none;min-height:64px;padding:0;font-weight:700;color:#8f2a1f}
.sos .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:#b3372a;border:6px solid #c0392b;box-shadow:var(--out-s);position:relative}
.sos .ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid #c0392b;animation:pulse 1.8s ease-out infinite}
.sos .lbl{background:var(--bg);padding:8px 14px;border-radius:999px;box-shadow:var(--out-s)}
.sos:hover .ring{transform:scale(1.05)}.sos:active .ring{box-shadow:var(--in)}
.sos.sent .ring{background:#c0392b;color:#fff}.sos.sent .ring::after{animation:none;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media(max-width:420px){.sos .lbl{display:none}.sos.sent .lbl{display:block}}
.btn.sosb{background:#c0392b;color:#fff;min-height:54px}.btn.sosb:hover{background:#a8311f}
.login{max-width:340px;margin:0 auto;padding:32px;border-radius:28px;box-shadow:var(--out);display:grid;gap:14px;color:var(--ink)}
.login input{min-height:54px;border:0;border-radius:16px;box-shadow:var(--in);background:none;padding:0 18px;font:inherit;text-align:center;letter-spacing:.2em;color:var(--ink)}
.login .err{color:var(--bad);min-height:1.4em;font-weight:700}.login p{color:var(--mut)}
#rf{margin-right:10px;box-shadow:var(--out-s);border-radius:12px}
header .wrap{justify-content:flex-start}header .brand{margin-right:auto}
.hero .row h1{margin:0}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="logo" aria-hidden="true">D</span><span>DineSync</span></div>
  <div class="pill" id="pill" aria-live="polite"></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="qrcode.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+n.toLocaleString('en-IN'), mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function api(path,body){
  const rk=path.startsWith('kitchen')?'ds_kitchen':path.startsWith('staff')?'ds_staff':'',h={};
  if(rk&&sessionStorage.getItem(rk))h['X-Token']=sessionStorage.getItem(rk);if(body)h['Content-Type']='application/json';
  try{const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});
    const d=await r.json().catch(()=>({}));
    if(r.status===401&&rk){sessionStorage.removeItem(rk);nav()}
    return{ok:r.ok,status:r.status,d}}catch(e){return{ok:false,status:0,d:{error:'Cannot reach the restaurant server'}}}
}
/* Staff and kitchen screens need a PIN; the server checks the token on every call */
function gate(role,run){
  const tk='ds_'+role,name=role=='staff'?'Staff':'Kitchen';
  $('#pill').textContent=name;
  if(sessionStorage.getItem(tk)){run();const b=$('#so');if(b)b.onclick=()=>{sessionStorage.removeItem(tk);nav()};return}
  $('#app').innerHTML=`<div class="state" style="padding-top:8vh"><div class="login"><h2>${name} sign in</h2><p>Enter your PIN to continue.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" placeholder="PIN"><button class="btn pri" id="go" style="width:100%">Sign in</button><div class="err" id="er" role="alert"></div></div></div>`;
  const go=async()=>{const r=await api('login',{role,pin:$('#pin').value.trim()});if(r.ok){sessionStorage.setItem(tk,r.d.token);nav()}else $('#er').textContent=r.d.error||'Could not sign in'};
  $('#go').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};$('#pin').focus();
}
function qrUrl(text,cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(cell,2)}
function printQR(n,url){const w=open('','_blank');if(!w)return toast('Allow pop-ups to print',true);
  w.document.write(`<title>Table ${n} QR</title><body style="font-family:Georgia,serif;text-align:center;padding:40px"><h1>DineSync</h1><img src="${qrUrl(url,10)}" style="width:340px;image-rendering:pixelated"><h2>Table ${n}</h2><p>Scan to view the menu and order</p><script>onload=function(){print()}<\/script>`);w.document.close()}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2800)}
const ICON={cart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>',
 call:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10.3 20a2 2 0 0 0 3.4 0"/></svg>',
 napkins:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 11h16M12 5v6"/></svg>',
 help:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>'};
let timers=[];const every=(f,ms)=>{f();timers.push(setInterval(f,ms))};

/* ---------- Router ---------- */
function nav(){
  timers.forEach(clearInterval);timers=[];document.querySelectorAll('.sheet,.scrim,.fab,.modal,.sos,#rf').forEach(e=>e.remove());
  const v=(location.hash.replace('#/','')||'menu').split('?')[0];
  const qs=location.search?location.search:'';
  ({menu:customer,kitchen,staff})[v]?.();
}
addEventListener('hashchange',nav);

/* ---------- Customer ---------- */
const RK=['call','help','tissues','cutlery','water','plates','sauces','straws'];
const icon=d=>`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const ESS=[['tissues','Extra Tissues','Fresh tissues or napkins for your table','M5 8h14v10H5zM8 8V5h8v3M9 13h6'],
 ['cutlery','Cutlery Set','Fork, spoon and knife, freshly wrapped','M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10'],
 ['water','Drinking Water','A bottle or jug of chilled water','M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'],
 ['plates','Extra Plates','Spare plates for sharing','M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'],
 ['sauces','Sauces & Condiments','Ketchup, chilli sauce, pickle and more','M10 3h4v3l1 3v12H9V9l1-3zM9 13h6'],
 ['straws','Straws','Fresh straws for your drinks','M8 21l4-16 3-1M12 5l3 .5M7 21h4'],
 ['help','Need Assistance','Anything else? Let our team know','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01']];
function customer(){
  const P=new URLSearchParams(location.search),table=+P.get('table'),key=P.get('k'),app=$('#app');$('#pill').textContent='';
  if(!table||!key){app.innerHTML=`<div class="state" style="padding-top:12vh"><b>Scan the QR code on your table</b>It opens the menu for your table, shared with everyone you're dining with.</div>`;return}
  let menu=[],cat='All',q='',S=null,sid=null,sig='',rsig='';
  const asked=k=>!!S&&S.requests.includes(RK.indexOf(k));
  app.innerHTML=`<section class="hero"><h1>One table. One shared experience.</h1><p>Everyone at your table sees the same cart, live.</p></section>
  <div class="seg" role="tablist"><button role="tab" id="tm" aria-selected="true">Food Menu</button><button role="tab" id="te" aria-selected="false">Table Essentials</button></div>
  <div id="pm"><label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search dishes" aria-label="Search dishes"></label>
  <div class="cats" id="cats" role="group" aria-label="Categories"></div><div class="grid" id="grid">${'<div class="sk"></div>'.repeat(6)}</div></div>
  <div id="pe" hidden><p class="note">These requests go straight to our staff, not the kitchen.</p><div class="grid" id="eg"></div></div>`;
  $('#pill').insertAdjacentHTML('beforebegin','<button class="btn sm" id="rf" aria-label="Refresh">⟳ Refresh</button>');
  const sheet=document.createElement('aside'),scrim=document.createElement('div'),fab=document.createElement('button'),sos=document.createElement('button');
  sheet.className='sheet';sheet.setAttribute('aria-label','Your table cart');scrim.className='scrim';fab.className='fab';sos.className='sos';
  fab.innerHTML=`${ICON.cart}<span>Table cart</span><span class="n" id="fn">0</span>`;
  sos.setAttribute('aria-label','Call staff to your table');sos.innerHTML=`<span class="ring">${ICON.call}</span><span class="lbl">Call staff</span>`;
  document.body.append(scrim,sheet,fab,sos);
  const open=()=>{renderSheet();sheet.classList.add('on');scrim.classList.add('on')},close=()=>{sheet.classList.remove('on');scrim.classList.remove('on')};
  fab.onclick=open;scrim.onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  $('#rf').onclick=async()=>{await poll();toast('Refreshed')};
  const show=v=>{$('#pm').hidden=v!='m';$('#pe').hidden=v!='e';$('#tm').setAttribute('aria-selected',v=='m');$('#te').setAttribute('aria-selected',v=='e')};
  $('#tm').onclick=()=>show('m');$('#te').onclick=()=>show('e');

  const qtyOf=id=>S?S.items.filter(i=>i.item===id).length:0;
  function renderCats(){const cs=['All',...new Set(menu.map(m=>m.cat))];$('#cats').innerHTML=cs.map(c=>`<button class="cat" aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join('');
    $('#cats').onclick=e=>{const c=e.target.dataset?.c;if(c){cat=c;renderCats();renderGrid()}}}
  function renderGrid(){
    const list=menu.filter(m=>(cat=='All'||m.cat==cat)&&(m.name+m.desc).toLowerCase().includes(q.toLowerCase()));
    $('#grid').innerHTML=list.length?list.map(m=>{const n=qtyOf(m.id);return `<article class="card"><div class="ph" style="background-image:url('${m.img}')" role="img" aria-label="${esc(m.name)}"></div>
      <div class="b"><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p><div class="meta"><span>${inr(m.price)}</span><span class="rate" aria-label="Rated ${m.rating}">★ ${m.rating}</span></div>
      ${n?`<div class="stepper"><button data-d="${m.id}" aria-label="Remove one ${esc(m.name)}">−</button><b>${n}</b><button data-a="${m.id}" aria-label="Add one ${esc(m.name)}">+</button></div>`:`<button class="add" data-a="${m.id}">Add to table</button>`}</div></article>`}).join(''):
      `<div class="empty" style="grid-column:1/-1"><b>No dishes found</b>Try a different word or category.</div>`;
    $('#grid').querySelectorAll('.ph').forEach(p=>{const u=p.style.backgroundImage.slice(5,-2);const im=new Image();im.onerror=()=>{p.style.backgroundImage='none';p.textContent=p.getAttribute('aria-label')[0]};im.src=u});
  }
  function renderEss(){$('#eg').innerHTML=ESS.map(([k,n,d,p])=>{const a=asked(k);return `<article class="card ess"><div class="ic">${icon(p)}</div><div class="b"><h3>${n}</h3><p>${d}</p><button class="${a?'btn':'add'}" data-e="${k}" ${a?'disabled':''}>${a?'Requested · on the way':'Request'}</button></div></article>`}).join('')}
  $('#q').oninput=e=>{q=e.target.value;renderGrid()};
  function fail(r){toast(r.d.error||'Something went wrong',true);poll()}
  $('#grid').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.a){const r=await api('cart/add',{sid,item:b.dataset.a});if(!r.ok)return fail(r);fab.classList.remove('bump');void fab.offsetWidth;fab.classList.add('bump');await poll()}
    if(b.dataset.d){const r=await api('cart/cancel',{sid,item:b.dataset.d});if(!r.ok)return fail(r);await poll()}};
  $('#eg').onclick=async e=>{const b=e.target.closest('button');if(!b||!b.dataset.e)return;b.disabled=true;
    const r=await api('assist',{sid,type:b.dataset.e});if(r.ok)toast('Request sent. Our staff will bring it shortly.');else toast(r.d.error,true);poll()};
  sos.onclick=()=>{if(asked('call'))return toast('Staff already called. They are on the way.');
    const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="alertdialog" aria-labelledby="ct"><h2 id="ct">Call staff to Table ${table}?</h2><p>A team member will come to your table right away.</p><div style="display:grid;gap:12px"><button class="btn sosb" id="yes">Yes, call staff now</button><button class="btn" id="no">Cancel</button></div></div>`;
    document.body.append(m);$('#no').onclick=()=>m.remove();$('#yes').focus();
    $('#yes').onclick=async()=>{m.remove();const r=await api('assist',{sid,type:'call'});r.ok?toast('Staff alerted. Someone is on the way.'):toast(r.d.error,true);poll()}};

  function renderSheet(){
    if(!S)return;const groups={};S.items.forEach(i=>(groups[i.item]??=[]).push(i));
    const cart=S.items.length?Object.values(groups).map(g=>{const f=g[0];return `<div class="group"><div class="row"><div><strong>${esc(f.name)}</strong><div class="lock">${g.length} × ${inr(f.price)} = <b>${inr(g.length*f.price)}</b></div></div>
      <div class="stepper" style="min-width:128px"><button data-d="${f.item}" aria-label="Remove one ${esc(f.name)}">−</button><b>${g.length}</b><button data-a="${f.item}" aria-label="Add one ${esc(f.name)}">+</button></div></div>
      ${g.map(i=>`<div class="line"><span class="chip ${i.status}">${i.status}</span>${i.left>0?`<span class="timer" aria-label="Cancel within ${mmss(i.left)}">${mmss(i.left)} left</span><button class="btn sm" data-c="${i.id}">Cancel</button>`:`<span class="lock">🔒 Cancellation closed</span>`}</div>`).join('')}</div>`}).join('')
      :`<div class="empty"><b>Your table's cart is empty</b>Add a dish from the menu and it appears for everyone here.</div>`;
    sheet.innerHTML=`<div class="hd"><h2>Table ${S.table} cart</h2><button class="btn sm" id="x" aria-label="Close cart">Close</button></div><div class="bd">${cart}</div>
      <div class="ft"><div class="total"><span>Table total</span><span>${inr(S.total)}</span></div><button class="btn" id="undo" style="width:100%" ${S.items.some(i=>i.left>0)?'':'disabled'}>Undo last addition</button></div>`;
  }
  sheet.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id=='x')return close();
    if(b.dataset.a){const r=await api('cart/add',{sid,item:b.dataset.a});return r.ok?poll():fail(r)}
    if(b.dataset.d){const r=await api('cart/cancel',{sid,item:b.dataset.d});return r.ok?poll():fail(r)}
    if(b.dataset.c){const r=await api('cart/cancel',{sid,line:+b.dataset.c});if(r.ok)toast('Item cancelled');return r.ok?poll():fail(r)}
    if(b.id=='undo'){const r=await api('cart/undo',{sid});return r.ok?poll():fail(r)}};

  async function poll(){
    if(!sid)return;const r=await api('state?sid='+sid);
    if(!r.ok&&r.status===0){$('#pill').textContent='Reconnecting…';return}
    if(!r.ok)return;S=r.d;$('#pill').textContent='Table '+S.table;$('#fn').textContent=S.count;
    sos.classList.toggle('sent',asked('call'));sos.querySelector('.lbl').textContent=asked('call')?'Staff on the way':'Call staff';
    if(!S.active&&!$('#ended')){const m=document.createElement('div');m.className='modal';m.id='ended';m.innerHTML=`<div class="box" role="alertdialog" aria-labelledby="mt"><h2 id="mt">This table session has ended</h2><p>Your orders are closed. Thank you for dining with us. A new group can start a fresh session.</p><button class="btn pri" id="ns" style="width:100%">Start a new session</button></div>`;
      document.body.append(m);$('#ns').onclick=async()=>{m.remove();await join()}}
    const s2=JSON.stringify(S.items.map(i=>[i.id,i.status]));if(s2!==sig){sig=s2;renderGrid()}
    const r2=JSON.stringify(S.requests);if(r2!==rsig){rsig=r2;renderEss()}
    if(sheet.classList.contains('on'))renderSheet();
  }
  async function join(){
    const j=await api('join',{table,key});
    if(!j.ok){app.innerHTML=`<div class="state" style="padding-top:12vh"><b>${esc(j.d.error||'Could not connect')}</b>Please scan the QR code on your table again or ask a team member for help.<br><br><button class="btn pri" onclick="nav()">Try again</button></div>`;return false}
    sid=j.d.sid;await poll();return true}
  (async()=>{
    const m=await api('menu');
    if(!m.ok){$('#grid').innerHTML=`<div class="state" style="grid-column:1/-1"><b>The menu didn't load</b>${esc(m.d.error||'')}<br><br><button class="btn pri" onclick="nav()">Retry</button></div>`;return}
    menu=m.d;renderCats();renderEss();if(await join()){renderGrid();every(poll,1000)}})();
}

/* ---------- Kitchen ---------- */
function kitchen(){gate('kitchen',kitchenInit)}
function kitchenInit(){
  $('#pill').textContent='Kitchen';$('#app').innerHTML=`<section class="hero"><div class="row"><h1>Kitchen queue</h1><button class="btn sm" id="so">Sign out</button></div><p id="ks">Loading orders…</p></section><div class="tickets" id="t"></div>`;
  let sig='';
  async function poll(){const r=await api('kitchen');if(!r.ok){$('#ks').textContent='Cannot reach server. Retrying…';return}
    const L=r.d;$('#ks').textContent=L.length?`${L.length} item${L.length>1?'s':''} in the queue, oldest first`:'';
    const h=L.length?L.map(o=>`<article class="ticket"><div class="row"><span class="big">#${o.line}</span><span class="pill">Table ${o.table}</span></div>
      <h3>${o.qty} × ${esc(o.name)}</h3><div class="row"><span class="chip ${o.status}">${o.status}</span></div>
      <div class="elig ${o.left>0?'yes':'no'}">${o.left>0?`Customer can still cancel · ${mmss(o.left)}`:'Cancellation closed'}</div>
      ${o.status=='Preparing'?`<button class="btn pri" data-l="${o.line}" data-s="completed">Mark completed</button>`:`<button class="btn pri" data-l="${o.line}" data-s="preparing">Start preparing</button>`}</article>`).join(''):
      `<div class="empty" style="grid-column:1/-1"><b>No open orders</b>New orders from tables appear here instantly.</div>`;
    if(h!==sig){sig=h;$('#t').innerHTML=h}}
  $('#t').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const r=await api('kitchen/status',{line:+b.dataset.l,status:b.dataset.s});if(!r.ok)toast(r.d.error,true);poll()};
  every(poll,1000);
}

/* ---------- Staff ---------- */
function staff(){gate('staff',staffInit)}
function staffInit(){
  $('#pill').textContent='Staff';$('#app').innerHTML=`<section class="hero"><div class="row"><h1>Floor overview</h1><button class="btn sm" id="so">Sign out</button></div><p>Requests are sorted by urgency.</p></section>
  <div class="cols"><div><h2 class="sec">Tables</h2><div class="tables" id="tb"></div></div><div><h2 class="sec">Assistance requests</h2><div id="rq" style="padding:10px 6px"></div></div></div>`;
  let sig='';
  async function poll(){const r=await api('staff');if(!r.ok)return;const D=r.d,s2=JSON.stringify(D);if(s2===sig)return;sig=s2;
    $('#tb').innerHTML=D.tables.map(t=>{const url=`${location.origin}/?table=${t.table}&k=${t.key}`;return `<article class="tcard"><div class="row"><h3>Table ${t.table}</h3><span class="chip ${t.items?'Preparing':'Confirmed'}">${t.active?(t.items?'Dining':'Open'):'Closed'}</span></div>
      <div class="free">${t.items} item${t.items==1?'':'s'} · ${inr(t.total)} · ${t.mins} min</div>
      <div class="row"><img class="qr" alt="QR code for table ${t.table}" src="${qrUrl(url,4)}"><div style="display:grid;gap:8px"><a class="btn sm" style="display:grid;place-items:center;text-decoration:none;border-radius:12px;box-shadow:var(--out-s)" href="${url}" target="_blank" rel="noopener">Open menu</a>
      <button class="btn sm" data-p="${t.table}" data-u="${url}">Print QR</button><button class="btn sm" data-x="${t.table}">Close &amp; reset</button></div></div></article>`}).join('');
    $('#rq').innerHTML=D.requests.length?D.requests.map(q=>`<div class="req ${q.urgent?'urgent':''}"><div><strong>Table ${q.table}</strong><div class="free">${q.type} · ${mmss(q.ago)} ago</div></div><button class="btn pri sm" data-r="${q.id}">Mark done</button></div>`).join(''):`<div class="empty"><b>All clear</b>New requests from tables appear here.</div>`}
  $('#app').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.p)printQR(b.dataset.p,b.dataset.u);
    if(b.dataset.r){await api('staff/done',{id:+b.dataset.r});toast('Request completed')}
    if(b.dataset.x&&confirm('Close the session for table '+b.dataset.x+'? Guests can no longer change their orders.')){await api('staff/close',{table:+b.dataset.x});toast('Table '+b.dataset.x+' closed. A new session is ready.')}
    sig='';poll()};
  every(poll,1200);
}
nav();
</script>
</body>
